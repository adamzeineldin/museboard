<title>Inroad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell with a left nav rail, a roomy card feed in the middle, and the Muse copilot docked on the right */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#EEF3F1; --fg:#14201C; --muted:#5E6C67; --line:#E1E8E5;
  --accent:#10B47E; --accent-ink:#0A7A56; --accent-fg:#FFFFFF; --accent-soft:#E2F6EE; --ring-track:#DCEDE6;
  --warm:#A35F06; --warm-soft:#FDF0DC; --hold:#B23B2B; --hold-soft:#FCE6E2; --ok:#0A7A56; --ok-soft:#E2F6EE;
  --shadow:0 1px 2px rgba(20,32,28,.04),0 4px 14px rgba(20,32,28,.05);
  --sans:"Plus Jakarta Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141D1A; --surface-2:#1B2622; --fg:#E5EDEA; --muted:#93A39D; --line:#25332E;
  --accent:#2FD39A; --accent-ink:#5BE0B1; --accent-fg:#042419; --accent-soft:#123328; --ring-track:#1E3a30;
  --warm:#EBAE55; --warm-soft:#382812; --hold:#F0907F; --hold-soft:#3B1E19; --ok:#5BE0B1; --ok-soft:#123328;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141D1A; --surface-2:#1B2622; --fg:#E5EDEA; --muted:#93A39D; --line:#25332E;
  --accent:#2FD39A; --accent-ink:#5BE0B1; --accent-fg:#042419; --accent-soft:#123328; --ring-track:#1E3a30;
  --warm:#EBAE55; --warm-soft:#382812; --hold:#F0907F; --hold-soft:#3B1E19; --ok:#5BE0B1; --ok-soft:#123328;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:1.6rem;line-height:1.2;font-weight:800}
h3{font-size:1.05rem;font-weight:700;line-height:1.35}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.78rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr) 370px;min-height:100vh;padding-right:env(safe-area-inset-right,0px)}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.muse{grid-column:2}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);padding-right:0}.muse{grid-column:1}}

/* Nav rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 20px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand b{font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:19px;height:19px;flex:none}
.nav .n{margin-left:auto;font-size:.72rem;background:var(--hold);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.camp-card{margin-top:auto;background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.82rem}
.meter{height:6px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
@media (max-width:760px){
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand b,.camp-card{display:none}
  .nav{flex-direction:row}
  .nav a{padding:7px 10px;font-size:.85rem;white-space:nowrap}
  .nav svg{display:none}
}

/* Main */
main{min-width:0;padding-block:24px 48px;padding-left:max(16px,2vw);padding-right:max(16px,2vw);display:flex;flex-direction:column;gap:18px}
@media (max-width:760px){main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.sample{font-size:.78rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;align-self:flex-start}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:.8rem;border-radius:8px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.hold{background:var(--hold-soft);color:var(--hold)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 8px}

/* Job cards */
.feed{display:flex;flex-direction:column;gap:14px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 150px;overflow:hidden}
.job-main{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.job-top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.95rem;flex:none}
.job-top .co{font-weight:700}
.job-top .posted{font-size:.8rem;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.job-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.job-foot .chips{display:flex;gap:6px;flex-wrap:wrap}
.job-score{background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;text-align:center}
.job-score.fair{background:var(--surface-2)}
.ring{position:relative;width:78px;height:78px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.job-score .lvl{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.job-score.fair .lvl{color:var(--muted)}
@media (max-width:560px){
  .job{grid-template-columns:minmax(0,1fr)}
  .job-score{order:-1;flex-direction:row;justify-content:flex-start;padding:10px 20px;gap:12px}
  .ring{width:52px;height:52px}.ring b{font-size:.9rem}
}

/* Generic list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:14px 18px;align-items:center;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:700}
.row .meta{font-size:.82rem;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:2px}
.row .side{display:flex;gap:8px;align-items:center}
.logo.person{border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
@media (max-width:560px){.row{grid-template-columns:44px minmax(0,1fr)}.row .side{grid-column:2}}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* Campaign */
.camp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.camp{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field .hint{font-size:.8rem;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.co{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 11px;font-size:.85rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.co[data-s="auto"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.co[data-s="ask"]{background:var(--warm-soft);border-color:var(--warm);color:var(--fg)}
.co em{font-style:normal;font-size:.68rem;font-weight:500;font-family:var(--mono);color:var(--muted)}
.inline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.inline{grid-template-columns:minmax(0,1fr)}}
input,select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.consent{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
@media (max-width:760px){.consent{position:static}}
.consent ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:.92rem}
.consent .state{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{font-size:.85rem;background:var(--warm-soft);color:var(--fg);border-radius:10px;padding:10px 12px}

/* Network */
.draft{background:var(--surface-2);border-radius:12px;padding:14px;font-size:.9rem;white-space:pre-wrap;max-width:65ch}
.packet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.packet{grid-template-columns:minmax(0,1fr)}}
.packet div{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.82rem}
.packet b{display:block;font-size:.85rem;margin-bottom:2px}

/* Muse copilot */
.muse{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
@media (max-width:1180px){.muse{position:static;height:auto;min-height:480px;border-left:0;border-top:1px solid var(--line);margin:0 max(16px,2vw) 32px;border:1px solid var(--line);border-radius:16px}}
@media (max-width:760px){.muse{margin:0 max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}}
.muse-h{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.who b{font-weight:800;font-size:1rem;display:block;line-height:1.2}
.who span{font-size:.76rem;color:var(--muted)}
.who .chip{margin-left:auto}
.tools{display:flex;flex-wrap:wrap;gap:4px}
.tools code{font-family:var(--mono);font-size:.68rem;background:var(--surface-2);color:var(--muted);padding:2px 6px;border-radius:5px}
.chat{padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
.msg{max-width:90%;padding:10px 13px;border-radius:16px;font-size:.88rem}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px;font-weight:500}
.msg.muse{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg.tool{align-self:stretch;max-width:100%;font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere}
.msg.tool b{color:var(--accent-ink);font-weight:500}
.msg .btn{margin-top:8px;display:inline-block;text-decoration:none}
.muse-f{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}.ring circle.v{transition:stroke-dasharray .5s ease}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 12 L8 4 L13 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Inroad</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="camp-card" id="campCard"></div>
  </aside>
  <main id="view"></main>
  <aside class="muse" aria-label="Muse copilot">
    <div class="muse-h">
      <div class="who"><span class="avatar" aria-hidden="true">M</span><div><b>Muse</b><span>Your agent, using Inroad</span></div><span class="chip ok">Connected</span></div>
      <div class="tools"><code>find_roles</code><code>find_warm_path</code><code>draft_outreach</code><code>prepare_application</code><code>submit_application</code></div>

      <button class="btn" id="resetBtn">Reset demo</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const COMPANIES=['Stripe','Datadog','Capital One','Cloudflare','Ramp','Palantir','Meta','Google'];
const JOBS=[
 {id:'j1',co:'Stripe',title:'Software Engineer Intern, Summer 2027',loc:'New York · Remote OK',type:'intern',match:91,posted:'2 hours ago',src:'Greenhouse feed',pay:'$55–60/hr'},
 {id:'j2',co:'Meta',title:'Software Engineer Intern, Summer 2027',loc:'Menlo Park · New York',type:'intern',match:88,posted:'5 hours ago',src:'Careers feed',pay:'$50–58/hr'},
 {id:'j3',co:'Google',title:'Software Engineering Intern, BS, Summer 2027',loc:'Multiple US offices',type:'intern',match:86,posted:'1 day ago',src:'Careers feed',pay:'$45–55/hr'},
 {id:'j4',co:'Datadog',title:'Software Engineer Intern 2027',loc:'New York',type:'intern',match:84,posted:'1 day ago',src:'Greenhouse feed',pay:'$50/hr'},
 {id:'j5',co:'Cloudflare',title:'Software Engineer Intern, Summer 2027',loc:'Austin',type:'intern',match:81,posted:'2 days ago',src:'Greenhouse feed',pay:'$45–50/hr'},
 {id:'j6',co:'Capital One',title:'Technology Internship Program, Summer 2027',loc:'McLean, VA',type:'intern',match:79,posted:'2 days ago',src:'Workday feed',pay:'$47/hr'},
 {id:'j7',co:'Ramp',title:'Software Engineer, New Grad 2027',loc:'New York',type:'newgrad',match:76,posted:'3 days ago',src:'Ashby feed',pay:'$160–190k'},
 {id:'j8',co:'Palantir',title:'Software Engineer Intern, Summer 2027',loc:'Washington, DC',type:'intern',match:71,posted:'4 days ago',src:'Lever feed',pay:'$50/hr'},
];
const CONTACTS=[
 {id:'c1',name:'Priya N.',role:'Software Engineer II, Payments',co:'Stripe',how:'Alum, class of 2023',tie:'Coffee chat Oct 14'},
 {id:'c2',name:'Marcus T.',role:'Production Engineer',co:'Meta',how:'Alum, class of 2021',tie:'Not contacted yet'},
 {id:'c3',name:'Dana L.',role:'Software Engineer, Cloud',co:'Google',how:'Hackathon mentor, March 2026',tie:'Met once'},
 {id:'c4',name:'Jordan K.',role:'Software Engineer',co:'Datadog',how:'Alum, class of 2024',tie:'Not contacted yet'},
];
const RESUMES=['Resume_v3.pdf','Resume_v2_backend.pdf'];
const ICONS={
 matches:'<path d="M4 8h16v11H4zM9 8V5h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 campaign:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 activity:'<path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 network:'<circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M16 6.5a3 3 0 0 1 0 5.5M17.5 14.6c1.6.6 2.6 2 3 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
};

function defaults(){
  return {
    draft:{roles:['intern'],auto:['Stripe','Datadog','Capital One','Cloudflare','Ramp'],ask:['Meta','Google'],resume:'Resume_v3.pdf',cap:5,minMatch:75,ends:'2026-12-15'},
    campaign:null, paused:false, weekCount:0, log:{}, chat:[], selContact:'c2', filter:'all'
  };
}
const START_CHAT=[
  {k:'user',t:'Find me SWE internships for next summer and handle the applications.'},
  {k:'muse',t:'I can do that with Inroad. Review the campaign rules once and I\'ll apply within them. Anything outside the rules comes back to you.',cta:'campaign'}
];
let S=defaults(); S.chat=START_CHAT.slice();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const initials=c=>c.split(' ').map(w=>w[0]).join('').slice(0,2);
const contactAt=co=>CONTACTS.filter(c=>c.co===co);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}

/* The rule check that runs before every submission */
function check(job,count=S.weekCount){
  const c=S.campaign?S.campaign.rules:null;
  if(!c) return {ok:false,why:'No approved campaign yet'};
  if(S.paused) return {ok:false,why:'Campaign is paused'};
  if('2026-11-07'>c.ends) return {ok:false,why:'Campaign has ended'};
  if(c.ask.includes(job.co)) return {ok:false,why:'Top choice: referral first',top:true};
  if(!c.auto.includes(job.co)) return {ok:false,why:'Not on your company list'};
  if(!c.roles.includes(job.type)) return {ok:false,why:'Role type not in campaign'};
  if(job.match<c.minMatch) return {ok:false,why:`Match below ${c.minMatch}%`};
  if(count>=c.cap) return {ok:false,why:'Weekly limit reached'};
  return {ok:true,why:'Fits campaign rules'};
}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

function renderNav(cur){
  const waiting=Object.values(S.log).filter(l=>l.status==='waiting').length;
  const items=[['matches','Jobs'],['campaign','Campaign'],['activity','Activity',waiting],['network','Warm paths']];
  $('#nav').innerHTML=items.map(([h,l,n])=>`<a href="#${h}" ${h===cur?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[h]}</svg>${l}${n?`<span class="n">${n}</span>`:''}</a>`).join('');
  const c=S.campaign;
  $('#campCard').innerHTML=c?`<span class="label">Campaign</span><b>${S.paused?'Paused':'Active'} · ${S.weekCount} of ${c.rules.cap} this week</b><div class="meter"><i style="width:${Math.min(100,S.weekCount/c.rules.cap*100)}%"></i></div><span class="muted">Ends ${fmtDate(c.rules.ends)}</span>`
    :`<span class="label">Campaign</span><b>Not approved</b><span class="muted">Muse asks before every application until you approve one.</span><a class="btn small primary" href="#campaign" style="text-decoration:none;text-align:center">Set up</a>`;
}

function statusChip(job){
  const l=S.log[job.id];
  if(l) return l.status==='submitted'?`<span class="chip ok">Applied${l.by==='you'?' · approved by you':''}</span>`:l.status==='skipped'?`<span class="chip neutral">Skipped</span>`:`<span class="chip hold">Waiting on you</span>`;
  const r=check(job);
  return r.ok?`<span class="chip ok">Will auto-apply</span>`:`<span class="chip ${r.top?'warm':'neutral'}">${esc(r.why)}</span>`;
}
function ring(m){
  const C=2*Math.PI*32, lvl=m>=85?'Strong match':m>=78?'Good match':'Fair match';
  return `<div class="job-score ${m<78?'fair':''}"><div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--ring-track)" stroke-width="7"/><circle class="v" cx="38" cy="38" r="32" fill="none" stroke="${m<78?'var(--muted)':'var(--accent)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(m/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${m}%</b></div><span class="lvl">${lvl}</span></div>`;
}

function vMatches(){
  const list=JOBS.filter(j=>S.filter==='all'||j.type===S.filter||(S.filter==='warm'&&contactAt(j.co).length));
  const f=[['all','Recommended'],['intern','Internships'],['newgrad','New grad'],['warm','Has a warm path']];
  return `<span class="sample">Prototype · sample roles and contacts · nothing is submitted</span>
  <div class="head"><div><h1>${JOBS.length} new matches for you</h1><p class="muted">From public company job feeds, ranked against ${esc(S.draft.resume)}.</p></div></div>
  <div class="filters">${f.map(([v,l])=>`<button class="pill" id="f-${v}" data-filter="${v}" aria-pressed="${S.filter===v}">${l}</button>`).join('')}</div>
  <div class="feed">${list.map(j=>{const cs=contactAt(j.co);return `<article class="job">
    <div class="job-main">
      <div class="job-top"><div class="logo" aria-hidden="true">${initials(j.co)}</div><div><div class="co">${esc(j.co)}</div><div class="posted">${j.posted} · <span class="mono">${esc(j.src)}</span></div></div></div>
      <h3>${esc(j.title)}</h3>
      <div class="tags"><span class="tag">${esc(j.loc)}</span><span class="tag">${j.type==='intern'?'Internship':'Full-time'}</span><span class="tag">${esc(j.pay)}</span></div>
      <div class="job-foot">
        <div class="chips">${statusChip(j)}${cs.length?`<span class="chip warm">${esc(cs[0].name)} works here</span>`:''}</div>
        <div class="actions">${cs.length?`<button class="btn small ghost" data-ask="${cs[0].id}">Ask for referral</button>`:''}<button class="btn small" data-prep="${j.id}">Prepare</button></div>
      </div>
    </div>${ring(j.match)}
  </article>`}).join('')||'<div class="list"><div class="empty">No roles match this filter.</div></div>'}</div>`;
}

function vCampaign(){
  const d=S.draft,c=S.campaign,changed=c&&!same(d,c.rules);
  const state=co=>d.auto.includes(co)?'auto':d.ask.includes(co)?'ask':'off';
  const lbl={auto:'auto',ask:'ask first',off:'skip'};
  return `<div class="head"><div><h1>Internship campaign</h1><p class="muted">Approve these rules once. Inroad applies within them and brings everything else back to you.</p></div></div>
  <div class="camp">
    <div class="panel">
      <div class="field"><span class="label">Role types</span><div class="opts">
        ${[['intern','Internships'],['newgrad','New grad']].map(([v,l])=>`<button class="toggle" id="role-${v}" data-role="${v}" aria-pressed="${d.roles.includes(v)}">${l}</button>`).join('')}</div></div>
      <div class="field"><span class="label">Companies</span><span class="hint">Tap to cycle: auto-apply, ask me first, skip.</span><div class="opts">
        ${COMPANIES.map(co=>`<button class="co" id="co-${co.replace(/\s/g,'')}" data-co="${esc(co)}" data-s="${state(co)}">${esc(co)}<em>${lbl[state(co)]}</em></button>`).join('')}</div></div>
      <div class="inline">
        <label class="field"><span class="label">Resume</span><select id="resume">${RESUMES.map(r=>`<option ${r===d.resume?'selected':''}>${r}</option>`).join('')}</select></label>
        <label class="field"><span class="label">Per week, max</span><input id="cap" type="number" min="1" max="20" value="${d.cap}"></label>
        <label class="field"><span class="label">Min match %</span><input id="minMatch" type="number" min="50" max="100" value="${d.minMatch}"></label>
      </div>
      <label class="field"><span class="label">Campaign ends</span><input id="ends" type="date" min="2026-11-08" value="${d.ends}" style="max-width:200px"></label>
    </div>
    <div class="consent">
      <span class="label">What you're approving</span>
      <ul>
        <li>Apply to <b>${d.roles.map(r=>r==='intern'?'internships':'new grad roles').join(' and ')||'no role types'}</b> at <b>${d.auto.join(', ')||'no companies'}</b>.</li>
        <li>Use <b>${esc(d.resume)}</b>, only for roles at <b>${d.minMatch}%+</b> match.</li>
        <li>At most <b>${d.cap} applications a week</b>, until <b>${fmtDate(d.ends)}</b>.</li>
        <li>${d.ask.length?`Never apply to <b>${d.ask.join(', ')}</b> without asking me. Draft a referral ask instead.`:'No companies set to ask first.'}</li>
        <li>Anything else, or any change to these rules, needs a new yes from me.</li>
      </ul>
      ${changed?`<div class="banner">You changed the rules. Inroad keeps using the version you approved until you approve this one.</div>`:''}
      <div class="state">${c?(S.paused?'<span class="chip hold">Paused</span>':'<span class="chip ok">Active</span>'):'<span class="chip neutral">Not approved</span>'}
        ${c?`<span class="muted" style="font-size:.82rem">Approved ${c.at}</span>`:''}</div>
      <div class="actions">
        <button class="btn primary" id="approve" ${(c&&!changed)||!d.auto.length||!d.roles.length?'disabled':''}>${c?'Approve new rules':'Approve campaign'}</button>
        ${c?`<button class="btn" id="pause">${S.paused?'Resume':'Pause'}</button><button class="btn" id="revoke">Revoke</button>`:''}
      </div>
    </div>
  </div>`;
}

function vActivity(){
  const L=Object.values(S.log);
  const n=s=>L.filter(l=>l.status===s).length;
  const cap=S.campaign?S.campaign.rules.cap:'–';
  const order={waiting:0,submitted:1,skipped:2};
  return `<div class="head"><div><h1>Activity</h1><p class="muted">Every application Inroad prepared, and why it went out or came back to you.</p></div></div>
  <div class="stats">
    <div class="stat"><b>${S.weekCount}/${cap}</b><span>Applied this week</span></div>
    <div class="stat"><b>${n('waiting')}</b><span>Waiting on you</span></div>
    <div class="stat"><b>${n('submitted')}</b><span>Applied</span></div>
    <div class="stat"><b>${n('skipped')}</b><span>Skipped</span></div>
  </div>
  ${L.length?`<div class="list">${L.sort((a,b)=>order[a.status]-order[b.status]).map(l=>{const j=JOBS.find(x=>x.id===l.job);return `<div class="row">
    <div class="logo" aria-hidden="true">${initials(j.co)}</div>
    <div style="min-width:0"><div class="t">${esc(j.co)} · ${esc(j.title)}</div>
      <div class="meta"><span>${esc(l.why)}</span><span class="mono">${esc(S.campaign?S.campaign.rules.resume:'')}</span></div></div>
    <div class="side">${l.status==='waiting'?`<button class="btn small primary" data-approve="${j.id}">Approve</button><button class="btn small" data-skip="${j.id}">Skip</button>`:l.status==='submitted'?'<span class="chip ok">Applied</span>':'<span class="chip neutral">Skipped</span>'}</div>
  </div>`}).join('')}</div>`:`<div class="list"><div class="empty">Nothing yet. Approve a campaign, then ask Muse to run this week's pass.</div></div>`}`;
}

function vNetwork(){
  const c=CONTACTS.find(x=>x.id===S.selContact), j=JOBS.find(x=>x.co===c.co);
  const resume=S.campaign?S.campaign.rules.resume:S.draft.resume;
  const draft=`Hi ${c.name.split(' ')[0]},

I'm a CS student and saw you're a ${c.role} at ${c.co}${c.how.startsWith('Alum')?' and an alum of my school':''}. I'm interested in the ${j.title} role and would value 15 minutes of your perspective on the team before I apply.

If you're comfortable referring me after we talk, I've put together a one-page packet so it takes you about two minutes. Either way, thanks for reading.`;
  return `<div class="head"><div><h1>Warm paths</h1><p class="muted">People you could ask, from contacts and alumni lists you connected.</p></div></div>
  <div class="list">${CONTACTS.map(p=>`<div class="row">
    <div class="logo person" aria-hidden="true">${initials(p.name)}</div>
    <div style="min-width:0"><div class="t">${esc(p.name)} <span class="muted" style="font-weight:500">· ${esc(p.role)}, ${esc(p.co)}</span></div>
      <div class="meta"><span>${esc(p.how)}</span><span>${esc(p.tie)}</span></div></div>
    <div class="side"><button class="btn small ${p.id===S.selContact?'primary':''}" data-ask="${p.id}">${p.id===S.selContact?'Drafting':'Draft ask'}</button></div>
  </div>`).join('')}</div>
  <div class="panel">
    <div class="head"><span class="label">Coffee chat request to ${esc(c.name)}</span><button class="btn small" id="copyDraft">Copy</button></div>
    <div class="draft" id="draftText">${esc(draft)}</div>
    <span class="label">Referral packet</span>
    <div class="packet">
      <div><b>The role</b>${esc(j.title)} at ${esc(j.co)}, with the posting link.</div>
      <div><b>Fit summary</b>Three lines matching your projects to the posting's requirements.</div>
      <div><b>Resume</b>${esc(resume)}, one page.</div>
    </div>
    <p class="muted" style="font-size:.82rem">Inroad drafts this. You send it yourself, from your own account.</p>
  </div>`;
}

function renderChat(){
  const ctaLabel={campaign:'Review campaign',activity:'Open activity',network:'See warm paths'};
  $('#chat').innerHTML=S.chat.map(m=>`<div class="msg ${m.k}">${m.k==='tool'?m.t:esc(m.t)}${m.cta?`<br><a class="btn small ghost" href="#${m.cta}">${ctaLabel[m.cta]}</a>`:''}</div>`).join('');
  $('#chat').scrollTop=1e6;
  $('#runBtn').disabled=!S.campaign||S.paused;
}
const say=(k,t,cta)=>S.chat.push({k,t,cta});

function runPass(){
  const fresh=JOBS.filter(j=>!S.log[j.id]);
  say('user','Run this week\'s applications.');
  say('tool',`<b>inroad.find_roles</b>(campaign) → ${fresh.length} new roles`);
  if(!fresh.length){say('muse','No new roles since the last pass. I\'ll check again tomorrow.');return render()}
  const sent=[],held=[];
  fresh.forEach(j=>{const r=check(j);
    if(r.ok){S.log[j.id]={job:j.id,status:'submitted',why:'Fits campaign rules',by:'inroad'};S.weekCount++;sent.push(j.co)}
    else{S.log[j.id]={job:j.id,status:'waiting',why:r.why,top:r.top};held.push(j)}});
  if(sent.length) say('tool',`<b>inroad.submit_application</b> × ${sent.length} → each checked against campaign rules first`);
  const tops=held.filter(h=>S.log[h.id].top).map(h=>h.co);
  if(tops.length) say('tool',`<b>inroad.draft_outreach</b>(${tops.join(', ')}) → referral asks ready`);
  let msg=sent.length?`Applied to ${sent.length}: ${sent.join(', ')}.`:'I didn\'t apply anywhere this pass.';
  if(held.length) msg+=` ${held.length} need you${tops.length?`. ${tops.join(' and ')} ${tops.length>1?'are top choices':'is a top choice'}, so I drafted referral asks instead of applying`:''}.`;
  say('muse',msg,held.length?'activity':null);
  render();
}

function render(){
  const h=(location.hash||'#matches').slice(1);
  const views={matches:vMatches,campaign:vCampaign,activity:vActivity,network:vNetwork};
  const key=views[h]?h:'matches';
  renderNav(key);
  $('#view').innerHTML=views[key]();
  renderChat();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=S.draft;
  if(t.dataset.filter){S.filter=t.dataset.filter;render()}
  else if(t.dataset.role){const r=t.dataset.role;d.roles=d.roles.includes(r)?d.roles.filter(x=>x!==r):[...d.roles,r];render()}
  else if(t.dataset.co){const co=t.dataset.co,s=t.dataset.s;
    d.auto=d.auto.filter(x=>x!==co);d.ask=d.ask.filter(x=>x!==co);
    if(s==='off')d.auto.push(co);else if(s==='auto')d.ask.push(co);
    const ord=(a,b)=>COMPANIES.indexOf(a)-COMPANIES.indexOf(b);d.auto.sort(ord);d.ask.sort(ord);render()}
  else if(t.id==='approve'){
    const at=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    const first=!S.campaign;
    S.campaign={rules:JSON.parse(JSON.stringify(d)),at};S.paused=false;
    say('tool',`<b>inroad.campaign.approve</b>(rules) → active until ${fmtDate(d.ends)}`);
    say('muse',first?`Campaign approved. I'll apply to roles that fit these rules, up to ${d.cap} a week, and bring the rest back to you.`:'Got the new rules. I\'ll use them from the next pass on.');
    toast('Campaign approved');render()}
  else if(t.id==='pause'){S.paused=!S.paused;say('muse',S.paused?'Paused. I won\'t submit anything until you resume.':'Resumed.');render()}
  else if(t.id==='revoke'){S.campaign=null;S.paused=false;say('muse','Campaign revoked. I\'ll ask you before every application from now on.');toast('Campaign revoked');render()}
  else if(t.dataset.approve){const l=S.log[t.dataset.approve];l.status='submitted';l.by='you';l.why='Approved by you';S.weekCount++;toast('Application submitted');render()}
  else if(t.dataset.skip){const l=S.log[t.dataset.skip];l.status='skipped';l.why='Skipped by you';render()}
  else if(t.dataset.ask){S.selContact=t.dataset.ask;if(location.hash!=='#network')location.hash='network';else render()}
  else if(t.dataset.prep){toast('Prepared. It goes out on the next pass if it fits your rules.')}
  else if(t.id==='copyDraft'){const txt=$('#draftText').textContent;
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('#draftText'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Press Ctrl+C to copy')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),sel)}catch(_){sel()}}
  else if(t.id==='runBtn')runPass();
  else if(t.id==='resetBtn'){S=defaults();S.chat=START_CHAT.slice();if(location.hash&&location.hash!=='#matches')location.hash='matches';else render()}
});
document.addEventListener('change',e=>{
  const d=S.draft,id=e.target.id;
  if(id==='resume')d.resume=e.target.value;
  else if(id==='cap')d.cap=Math.max(1,Math.min(20,+e.target.value||1));
  else if(id==='minMatch')d.minMatch=Math.max(50,Math.min(100,+e.target.value||75));
  else if(id==='ends'&&e.target.value)d.ends=e.target.value;
  else return;
  render();
});
render();
</script>
